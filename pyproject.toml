[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeclone-validation-corpus"
version = "0.1.0"
description = "External black-box acceptance corpus for CodeClone public CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.23.0",
]

[project.scripts]
corpus-run = "corpus_tools.cli:main"

[tool.setuptools]
packages = ["corpus_tools"]
